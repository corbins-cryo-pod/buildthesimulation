<title id="title">Original BTS-HANDLING Mk I top plan</title><desc id="desc">Two cassette frames flank a wand; a 100 mm staging tray and a 75 mm undersized tray are in front. Top-plan depiction uses nominal dimensions, in millimetres.</desc>
