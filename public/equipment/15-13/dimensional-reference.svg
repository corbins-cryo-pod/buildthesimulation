 <title id="title">Original geometry cards, drawing BTS-1513-G01 revision 1</title><desc id="desc">Top plan of the separate locator: 84 millimeter X-span, 66 millimeter depth, plus an 18 millimeter wide keyed relief extending 11 millimeters. Center of relief offset 16 millimeters from X zero. The separate nominal block is 80 by 62 with a 14 millimeter wide key.</desc>
