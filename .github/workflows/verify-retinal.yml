name: Verify retinal laboratory
on:
  pull_request:
    paths:
      - 'src/lib/retinal-implant/**'
      - 'src/components/RetinalImplantLaboratory.jsx'
      - 'src/styles/retinal-implant.css'
      - 'src/pages/simulations/retinal-implant/**'
      - 'public/assets/retinal-implant/**'
      - 'tests/retinal-*.mjs'
      - 'tests/fixtures/retinal-*/**'
      - 'scripts/retinal-reference/**'
      - 'scripts/verify-retinal-build.mjs'
      - 'docs/retinal-implant/**'
      - '.github/workflows/verify-retinal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/retinal-reference/requirements.txt
      - name: Install application and pinned references
        id: dependencies
        run: |
          npm ci
          python -m pip install -r scripts/retinal-reference/requirements.txt
      - name: Verify independent reference-check guards
        run: python -W error -m unittest discover -s scripts/retinal-reference -p 'test_*.py' -v
      - name: Reproduce independent scientific references
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          retinal_reference_dir="$(mktemp -d)"
          python scripts/retinal-reference/generate.py --repo "$retinal_reference_dir"
          python -W error scripts/retinal-reference/field_reference.py --output "$retinal_reference_dir/tests/fixtures/retinal-field/independent-reference.json"
          python scripts/retinal-reference/verify_reproduction.py --generated "$retinal_reference_dir"
          git diff --exit-code -- public/assets/retinal-implant tests/fixtures/retinal-percept tests/fixtures/retinal-field/independent-reference.json
      - name: Verify complete numerical experiments
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --test tests/retinal-field.mjs tests/retinal-percept.mjs tests/retinal-experiment.mjs
      - name: Verify real workers, WebGL and responsive controls
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          RETINAL_REQUIRE_BROWSER: '1'
          RETINAL_QA_DIR: retinal-browser-artifacts
        run: node --test tests/retinal-browser.mjs
      - name: Verify production build and reference assets
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          npx astro build
          node scripts/verify-retinal-build.mjs
      - name: Save browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retinal-browser-verification
          path: retinal-browser-artifacts
          if-no-files-found: ignore
