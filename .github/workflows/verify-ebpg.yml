name: Verify EBPG 5200+ equipment
on:
  pull_request:
    paths:
      - 'public/equipment/02-05/**'
      - 'src/lib/equipment/02-05-viewer.js'
      - 'src/pages/simulations/equipment/02-05/**'
      - 'tests/equipment-02-05-ebpg.mjs'
      - 'scripts/verify-ebpg-browser.mjs'
      - '.github/workflows/verify-ebpg.yml'
  push:
    branches: [main]
    paths:
      - 'public/equipment/02-05/**'
      - 'src/lib/equipment/02-05-viewer.js'
      - 'src/pages/simulations/equipment/02-05/**'
      - '.github/workflows/verify-ebpg.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/equipment-02-05-ebpg.mjs
      - name: Build
        run: npm run build --ignore-scripts
      - name: Browser verification on built site
        env:
          EBPG_QA_DIR: ebpg-qa
        run: node --test scripts/verify-ebpg-browser.mjs
      - name: Browser verification on production
        if: github.event_name == 'push'
        env:
          EBPG_URL: https://buildthesimulation.com
          EBPG_QA_DIR: ebpg-production-qa
        run: node --test scripts/verify-ebpg-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebpg-browser-evidence
          path: |
            ebpg-qa
            ebpg-production-qa
