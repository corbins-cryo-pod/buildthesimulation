name: Tissue Phase 2 reference verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/tissue-mechanics/**'
      - 'scripts/tissue-phase2/**'
      - 'tests/tissue-phase2*.mjs'
      - '.github/workflows/tissue-phase2-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent numerical reference packages
        run: python -m pip install numpy scipy 'jax[cpu]' 'felupe==11.3.0' tensortrax
      - name: Retrieve pinned primary experimental source
        run: |
          python - <<'PY'
          import urllib.request, hashlib, json, zipfile, io, base64
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('artifacts/tissue-phase2');p.mkdir(parents=True,exist_ok=True)
          url='https://api.github.com/repos/LivingMatterLab/CANN/git/blobs/6e7bc72c317a29d24064eaf38c6f5951c226abcb'
          info=json.load(urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'BuildTheSimulation-validation'})))
          data=base64.b64decode(info['content']);assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='6e7bc72c317a29d24064eaf38c6f5951c226abcb'
          (p/'CANNsBRAINdata.xlsx').write_bytes(data)
          z=zipfile.ZipFile(io.BytesIO(data));ns={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
          strings=[''.join(t.itertext()) for t in ET.fromstring(z.read('xl/sharedStrings.xml')).findall('m:si',ns)]
          sheets={}
          for name in sorted(z.namelist()):
            if name.startswith('xl/worksheets/sheet') and name.endswith('.xml'):
              rows=[]
              for row in ET.fromstring(z.read(name)).findall('.//m:row',ns):
                values={}
                for c in row.findall('m:c',ns):
                  v=c.find('m:v',ns)
                  if v is not None:
                    values[c.attrib['r']]=strings[int(v.text)] if c.get('t')=='s' else float(v.text)
                if values: rows.append(values)
              sheets[name]=rows
          result={'source':url,'blobSha':'6e7bc72c317a29d24064eaf38c6f5951c226abcb','sha256':hashlib.sha256(data).hexdigest(),'sheets':sheets}
          (p/'experimental-source.json').write_text(json.dumps(result,indent=2));print('PRIMARY_SOURCE_JSON='+json.dumps(result,separators=(',',':')))
          PY
      - name: Verify Phase 2 implementation when present
        run: |
          if [ -f scripts/tissue-phase2/validate.mjs ]; then
            node --test tests/tissue-phase2*.mjs
            node scripts/tissue-phase2/validate.mjs
            python scripts/tissue-phase2/reference.py
            python scripts/tissue-phase2/calibrate.py
          else
            echo 'Research-input preparation only; no Phase 2 verification is claimed.'
          fi
      - name: Preserve reference results and primary-input provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tissue-phase2-reference
          path: artifacts/tissue-phase2
          retention-days: 14
