name: Verify Cee 200CBX equipment 02-08
on:
  pull_request:
    paths: ['public/equipment/02-08/**','src/lib/equipment/02-08/**','src/pages/simulations/equipment/02-08/**','src/data/equipment/zones/02.json','tests/equipment-02-08-cee.mjs','scripts/equipment/02-08/**','.github/workflows/verify-cee-200cbx.yml']
  push:
    branches: [main]
    paths: ['public/equipment/02-08/**','src/lib/equipment/02-08/**','src/pages/simulations/equipment/02-08/**','src/data/equipment/zones/02.json','.github/workflows/verify-cee-200cbx.yml']
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --test scripts/equipment/02-08/browser-smoke.mjs
      - name: Production browser verification
        if: github.event_name == 'push'
        env:
          CEE_URL: https://buildthesimulation.com
        run: node --test scripts/equipment/02-08/browser-smoke.mjs
