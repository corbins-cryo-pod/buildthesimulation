name: Verify site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Keep the real browser test out of the CPU-heavy reference-test pool.
      # It still runs with all its assertions before a build can pass.
      - name: Test numerical references and content
        shell: bash
        run: |
          mapfile -t tests < <(find tests -maxdepth 1 -name '*.mjs' ! -name 'tissue-mechanics-browser.mjs' | sort)
          node --test "${tests[@]}"
      - name: Test mechanics in the browser without CPU contention
        env:
          TISSUE_REQUIRE_BROWSER: '1'
        run: node --test tests/tissue-mechanics-browser.mjs
      - name: Build site and model assets
        run: npm run build --ignore-scripts
      - name: Verify Biohybrid routes, scientific disclosures and worker artifacts
        run: node scripts/verify-biohybrid-build.mjs
      - name: Verify Cell Growth Lab routes, worker and numerical evidence
        run: node scripts/verify-cell-growth-build.mjs
      - name: Verify Cortex routes and worker artifacts
        run: node scripts/verify-cortex-build.mjs
      - name: Verify cochlear laboratory routes and numerical worker
        run: node scripts/verify-cochlear-build.mjs
      - name: Verify Finger Atlas geometry and published assets
        run: node scripts/verify-finger-atlas.mjs --build
      - name: Verify continuous V4 Finger Atlas and lightweight assets
        run: node scripts/verify-finger-atlas-v4.mjs --build
