name: Equipment 09-08 passive two-port
on:
  pull_request:
    paths:
      - 'public/equipment/09-08/**'
      - 'scripts/equipment/09-08/**'
      - 'src/pages/simulations/equipment/09-08/**'
      - 'src/lib/equipment/09-08/**'
      - 'tests/equipment-09-08-pnax.mjs'
      - '.github/workflows/equipment-09-08.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reproduce scattering and enclosure checks
        run: |
          node scripts/equipment/09-08/verify.mjs
          node scripts/equipment/09-08/geometry.mjs
          git diff --exit-code -- public/equipment/09-08
          node --test tests/equipment-09-08-pnax.mjs
      - run: npm run build
      - name: Exercise both browser sizes, GLB, THRU calibration and replay, exports and failures
        run: |
          python3 -m venv "$RUNNER_TEMP/clamp-browser"
          "$RUNNER_TEMP/clamp-browser/bin/pip" install playwright==1.56.0
          "$RUNNER_TEMP/clamp-browser/bin/playwright" install --with-deps chromium
          export CHROMIUM_PATH=$("$RUNNER_TEMP/clamp-browser/bin/python" -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python3 -m http.server --bind 127.0.0.1 --directory dist 4428 &
          server=$!
          trap 'kill $server' EXIT
          "$RUNNER_TEMP/clamp-browser/bin/python" scripts/equipment/09-08/browser-smoke.py http://127.0.0.1:4428
