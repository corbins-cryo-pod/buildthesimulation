name: Verify Bruker DektakXT
on:
  pull_request:
    paths:
      - 'public/equipment/05-01/**'
      - 'src/lib/equipment/05-01/**'
      - 'src/pages/simulations/equipment/05-01/**'
      - 'scripts/equipment/05-01/**'
      - 'tests/equipment-05-01*.mjs'
      - '.github/workflows/verify-equipment-05-01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4051 --directory dist >/tmp/equipment-05-01.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://localhost:4051/simulations/equipment/05-01/ -o /tmp/equipment-05-01-record.html; then break; fi
            sleep 1
          done
          python scripts/equipment/05-01/browser-smoke.py
