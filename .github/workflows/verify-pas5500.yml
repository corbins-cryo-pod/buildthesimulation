name: Verify PAS 5500/275D equipment
on:
  pull_request:
    paths:
      - 'public/equipment/02-06/**'
      - 'src/lib/equipment/02-06/**'
      - 'src/pages/simulations/equipment/02-06/**'
      - 'tests/equipment-02-06.mjs'
      - 'scripts/verify-pas5500-browser.mjs'
      - '.github/workflows/verify-pas5500.yml'
  push:
    branches: [main]
    paths:
      - 'public/equipment/02-06/**'
      - 'src/lib/equipment/02-06/**'
      - 'src/pages/simulations/equipment/02-06/**'
      - '.github/workflows/verify-pas5500.yml'
  workflow_dispatch:
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/equipment-02-06.mjs tests/equipment-register.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Local production browser test
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > pas-preview.log 2>&1 &
          node scripts/verify-pas5500-browser.mjs
      - name: Live production browser test
        if: github.event_name == 'push'
        env:
          PAS_URL: https://buildthesimulation.com
          PAS_QA_DIR: pas-production-qa
        run: node scripts/verify-pas5500-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pas5500-browser-evidence
          path: |
            pas-qa
            pas-production-qa
            pas-preview.log
