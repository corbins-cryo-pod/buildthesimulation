name: Verify Astro rendering
on:
  pull_request:
  workflow_dispatch:

jobs:
  astro-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build site without prebuild tests
        run: npx astro build
