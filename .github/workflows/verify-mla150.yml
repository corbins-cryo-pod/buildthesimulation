name: Verify MLA 150 equipment
on:
  pull_request:
    paths:
      - 'public/equipment/02-03/**'
      - 'src/lib/equipment/02-03/**'
      - 'src/pages/simulations/equipment/02-03/**'
      - 'tests/equipment-02-03.mjs'
      - 'scripts/verify-mla150-browser.mjs'
      - '.github/workflows/verify-mla150.yml'
  push:
    branches: [main]
    paths:
      - 'public/equipment/02-03/**'
      - 'src/lib/equipment/02-03/**'
      - 'src/pages/simulations/equipment/02-03/**'
      - '.github/workflows/verify-mla150.yml'
  workflow_dispatch:
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/equipment-02-03.mjs tests/equipment-register.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Browser test local production build
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > mla-preview.log 2>&1 &
          node scripts/verify-mla150-browser.mjs
      - name: Browser test public deployment
        if: github.event_name == 'push'
        env:
          MLA_URL: https://buildthesimulation.com
          MLA_QA_DIR: mla-production-qa
        run: node scripts/verify-mla150-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mla150-browser-evidence
          path: |
            mla-qa
            mla-production-qa
            mla-preview.log
