name: Verify Keysight SR560
on:
  pull_request:
    paths:
      - 'public/equipment/09-10/**'
      - 'src/lib/equipment/09-10/**'
      - 'src/pages/simulations/equipment/09-10/**'
      - 'scripts/equipment/09-10/**'
      - 'tests/equipment-09-10*.mjs'
      - '.github/workflows/verify-equipment-09-10.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4100 --directory dist > /tmp/equipment-09-10-server.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://localhost:4100/simulations/equipment/09-10/ -o /tmp/equipment-09-10-record.html; then break; fi
            sleep 1
          done
          python scripts/equipment/09-10/browser-smoke.py
